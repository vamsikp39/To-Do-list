<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(to right, #74ebd5, #ACB6E5);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 40px;
    }
    .container {
      width: 400px;
      background: #fff;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0px 5px 15px rgba(0,0,0,0.15);
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }
    .input-area {
      display: flex;
      gap: 10px;
    }
    input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    .filters {
      display: flex;
      justify-content: space-between;
      margin: 20px 0;
    }
    .filters button {
      flex: 1;
      margin: 0 5px;
      background: #e9ecef;
      color: #333;
      border: none;
      cursor: pointer;
      padding: 8px;
      border-radius: 8px;
    }
    .filters button.active {
      background: #007bff;
      color: #fff;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      background: #f8f9fa;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-direction: column;
    }
    li.completed .task-text {
      text-decoration: line-through;
      color: gray;
    }
    .task-top {
      display: flex;
      justify-content: space-between;
      width: 100%;
      align-items: center;
    }
    .task-text {
      flex: 1;
      cursor: pointer;
    }
    .time {
      font-size: 12px;
      color: #777;
      margin-top: 5px;
    }
    .task-buttons {
      display: flex;
      gap: 5px;
    }
    .task-buttons button {
      background: #ccc;
      padding: 5px 8px;
      font-size: 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .task-buttons button.edit {
      background: #ffc107;
      color: #fff;
    }
    .task-buttons button.complete {
      background: #28a745;
      color: #fff;
    }
    .task-buttons button.delete {
      background: #dc3545;
      color: #fff;
    }
    .stats {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝To-Do List</h1>
    <div class="input-area">
      <input type="text" id="taskInput" placeholder="Add a new task..." />
      <button onclick="addTask()">Add</button>
    </div>

    <div class="filters">
      <button onclick="filterTasks('all')" class="active">All</button>
      <button onclick="filterTasks('active')">Active</button>
      <button onclick="filterTasks('completed')">Completed</button>
    </div>

    <ul id="taskList"></ul>

    <div class="stats" id="stats"></div>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
    let filter = "all";

    function saveTasks() {
      localStorage.setItem("tasks", JSON.stringify(tasks));
    }

    function updateStats() {
      const total = tasks.length;
      const completed = tasks.filter(t => t.completed).length;
      const pending = total - completed;
      document.getElementById("stats").innerText = 
        `Total: ${total} | Completed: ${completed} | Pending: ${pending}`;
    }

    function renderTasks() {
      const taskList = document.getElementById("taskList");
      taskList.innerHTML = "";
      const filtered = tasks.filter(t => 
        filter === "all" ? true : filter === "completed" ? t.completed : !t.completed
      );

      filtered.forEach((task, index) => {
        const li = document.createElement("li");
        if (task.completed) li.classList.add("completed");

        const topDiv = document.createElement("div");
        topDiv.className = "task-top";

        const taskText = document.createElement("div");
        taskText.className = "task-text";
        taskText.textContent = task.text;
        taskText.onclick = () => toggleTask(index);

        const btnDiv = document.createElement("div");
        btnDiv.className = "task-buttons";

        const editBtn = document.createElement("button");
        editBtn.className = "edit";
        editBtn.textContent = "Edit";
        editBtn.onclick = () => editTask(index);

        const completeBtn = document.createElement("button");
        completeBtn.className = "complete";
        completeBtn.textContent = task.completed ? "Completed" : "Complete";
        completeBtn.onclick = () => toggleTask(index);

        const delBtn = document.createElement("button");
        delBtn.className = "delete";
        delBtn.textContent = "Delete";
        delBtn.onclick = () => deleteTask(index);

        btnDiv.appendChild(editBtn);
        btnDiv.appendChild(completeBtn);
        btnDiv.appendChild(delBtn);

        topDiv.appendChild(taskText);
        topDiv.appendChild(btnDiv);

        const timeDiv = document.createElement("div");
        timeDiv.className = "time";
        timeDiv.textContent = `Added: ${task.time}`;

        li.appendChild(topDiv);
        li.appendChild(timeDiv);
        taskList.appendChild(li);
      });

      updateStats();
    }

    function addTask() {
      const input = document.getElementById("taskInput");
      const text = input.value.trim();
      if (text === "") {
        alert("Please enter a task!");
        return;
      }
      const time = new Date().toLocaleString();
      tasks.push({ text, completed: false, time });
      input.value = "";
      saveTasks();
      renderTasks();
    }

    function toggleTask(index) {
      tasks[index].completed = !tasks[index].completed;
      saveTasks();
      renderTasks();
    }

    function deleteTask(index) {
      tasks.splice(index, 1);
      saveTasks();
      renderTasks();
    }

    function editTask(index) {
      const newText = prompt("Edit task:", tasks[index].text);
      if (newText !== null && newText.trim() !== "") {
        tasks[index].text = newText.trim();
        saveTasks();
        renderTasks();
      }
    }

    function filterTasks(type) {
      filter = type;
      document.querySelectorAll(".filters button").forEach(btn => btn.classList.remove("active"));
      event.target.classList.add("active");
      renderTasks();
    }

    document.getElementById("taskInput").addEventListener("keypress", e => {
      if (e.key === "Enter") addTask();
    });

    renderTasks();
  </script>
</body>
</html>
